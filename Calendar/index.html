<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calender</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <div class="w-full min-h-screen bg-linear-to-tr from-[#1d0000] to-[#20205b] flex items-center justify-center">
        <div class="w-75 h-62.5 bg-white flex items-center justify-center rounded-xl ">
            <div class="w-[60%] h-full flex items-center justify-center text-[24px] flex-col">
                <p id="date" class="text-[100px]">01</p>
                <p id="day">Sunday</p>
            </div>
            <div class="w-[40%] h-full flex items-center justify-center text-[24px] bg-[#f4351e] text-white rounded-tr-xl rounded-br-xl flex-col">
                <p id="month">January</p>
                <p id="year">2026</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
