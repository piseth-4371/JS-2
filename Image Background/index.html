<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background</title>
    <link rel="stylesheet" href="../output.css">
    <style>
        .imgBox{
            background-image: url('images/background.png');
        }
    </style>
</head>
<body>
    <div class="w-full h-screen flex items-center justify-center bg-[#f3fbff]">
        <div class="w-6/10 m-auto leading-0 overflow-hidden relative imgBox left-5">
            <img src="images/transparent.png" width="100%" >
            <div class="absolute left-0 top-0 overflow-hidden imgWrap w-5">
                <img src="images/original.jpg" id="originalImg" class="w-full">
            </div>
            <span class="absolute w-px h-full cursor-ew-resize bg-white left-0 top-0" id="line">
                <img src="images/arrow.png" class="w-10 absolute top-1/2 -ml-5 -mt-5">
            </span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
